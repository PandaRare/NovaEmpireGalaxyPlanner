<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#14213d;--mut:#5b6678;--line:#d5dbe6;--edge:rgba(40,70,120,.22);--dot:#9aa6bd;--acc:#0a6cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--panel:#0e1526;--ink:#e6edf8;--mut:#8b97ad;--line:#1f2b45;--edge:rgba(100,180,255,.2);--dot:#4a5775;--acc:#00c8ff}}
:root[data-theme="dark"]{--bg:#070b16;--panel:#0e1526;--ink:#e6edf8;--mut:#8b97ad;--line:#1f2b45;--edge:rgba(100,180,255,.2);--dot:#4a5775;--acc:#00c8ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:4px}
button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;min-height:0;display:flex}
#wrap{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block;cursor:grab}
aside{width:270px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
aside h2{font-size:13px;margin:0 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:3px 0;cursor:pointer;font-size:13px}
.row:hover{color:var(--acc)}.rk{color:var(--mut);font-size:11px}
.bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);margin-top:-2px}.bar i{display:block;height:100%;border-radius:2px}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
#leg{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--mut)}
#leg div{width:150px;height:8px;border-radius:4px;margin:3px 0}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;height:36%;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>

const P=n=>[cam.x+n[1]*cam.k,cam.y-n[2]*cam.k];
const cur=()=>D[sv][mode];
const tf=(v,m)=>m?(sc==="sqrt"?Math.sqrt(v/m):v/m):0;
function draw(){
 const css=getComputedStyle(document.documentElement),cnt=cur(),mx=Math.max(...cnt,1);
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 cx.strokeStyle=css.getPropertyValue("--edge");cx.lineWidth=.8;cx.beginPath();
 E.forEach(([a,b])=>{const p=P(N[a]),q=P(N[b]);cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1])});cx.stroke();
 const ord=N.map((_,i)=>i).sort((a,b)=>cnt[a]-cnt[b]);
 ord.forEach(i=>{const n=N[i],p=P(n),v=cnt[i];
  if(!v){cx.fillStyle=css.getPropertyValue("--dot");if(n[3]!==0)cx.fillRect(p[0]-2,p[1]-2,4,4);else{cx.beginPath();cx.arc(p[0],p[1],1.6,0,7);cx.fill()}return}
  const t=tf(v,mx),c=col(t),r=(3+t*9)*Math.max(.6,cam.k/8),g=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*2.6);
  g.addColorStop(0,"rgba("+c+",.55)");g.addColorStop(1,"rgba("+c+",0)");
  cx.fillStyle=g;cx.beginPath();cx.arc(p[0],p[1],r*2.6,0,7);cx.fill();
  cx.fillStyle="rgb("+c+")";cx.beginPath();cx.arc(p[0],p[1],r*.55+1.5,0,7);cx.fill();
  if(n[3]!==0){cx.strokeStyle=css.getPropertyValue("--ink");cx.lineWidth=1.5;cx.beginPath();cx.arc(p[0],p[1],r*.55+4.5,0,7);cx.stroke()}});
 cx.font="11px system-ui,sans-serif";cx.textAlign="center";cx.fillStyle=css.getPropertyValue("--ink");
 const top=ord.slice(-12);
 N.forEach((n,i)=>{if(!(top.includes(i)||i===hi||i===hov||(cam.k>14&&cnt[i])))return;const p=P(n);if(i===hi){cx.strokeStyle=css.getPropertyValue("--acc");cx.lineWidth=2;cx.beginPath();cx.arc(p[0],p[1],14,0,7);cx.stroke()}cx.fillText(n[0]+" "+cnt[i],p[0],p[1]-13)})}
function side(){const cnt=cur(),tot=cnt.reduce((a,b)=>a+b,0),occ=cnt.filter(v=>v).length;
 $("ttl").textContent=sv==="Global"?"Global — 16 serveurs":"Serveur "+sv;
 $("sub").textContent=tot+(mode?" comptes actifs":" comptes")+" dans "+occ+" systèmes";
 const o=N.map((_,i)=>i).filter(i=>cnt[i]).sort((a,b)=>cnt[b]-cnt[a]).slice(0,15),mx=cnt[o[0]]||1;
 $("list").innerHTML=o.map((i,r)=>'<div class="row" data-i="'+i+'"><span class="rk">'+(r+1)+'</span><span>'+N[i][0]+'</span><b>'+cnt[i]+'</b><div class="bar"><i style="width:'+cnt[i]/mx*100+'%;background:rgb('+col(tf(cnt[i],mx))+')"></i></div></div>').join("");
 document.querySelectorAll(".row").forEach(e=>e.onclick=()=>{hi=+e.dataset.i;draw()})}
function upd(){hi=-1;side();draw()}
sel.onchange=()=>{sv=sel.value;upd()};
$("mode").onclick=e=>{if(!e.target.dataset.m)return;mode=+e.target.dataset.m;[...$("mode").children].forEach(b=>b.classList.toggle("on",b===e.target));upd()};
$("sc").onclick=e=>{if(!e.target.dataset.s)return;sc=e.target.dataset.s;[...$("sc").children].forEach(b=>b.classList.toggle("on",b===e.target));upd()};
function near(ev){const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;let b=-1,bd=14*14;N.forEach((n,i)=>{const p=P(n),d=(p[0]-mx)**2+(p[1]-my)**2;if(d<bd){bd=d;b=i}});return[b,mx,my]}
let drag=null;
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"};
cv.onpointerup=()=>{drag=null;cv.style.cursor="grab"};
cv.onpointermove=e=>{if(drag){cam.x=drag.cx+e.clientX-drag.x;cam.y=drag.cy+e.clientY-drag.y;draw();return}
 const[b,mx,my]=near(e),t=$("tip");if(b!==hov){hov=b;draw()}
 if(b<0){t.style.display="none";return}t.style.display="block";t.textContent=N[b][0]+" — "+cur()[b]+" compte"+(cur()[b]>1?"s":"");t.style.left=Math.min(mx+12,W-150)+"px";t.style.top=(my+12)+"px"};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY<0?1.15:1/1.15;cam.x=mx-(mx-cam.x)*f;cam.y=my-(my-cam.y)*f;cam.k*=f;draw()};
cv.ondblclick=()=>{fit();draw()};
addEventListener("resize",size);size();side();
</script></body></html>
